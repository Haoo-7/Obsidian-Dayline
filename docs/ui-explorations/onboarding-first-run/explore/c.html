<title>索引卡</title>

<style>
.start{flex:0 0 auto;margin:2px 14px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.start-head{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-bottom:1px solid var(--line)}
.start-title{font-size:12px;font-weight:600}
.start-progress{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.start-close{display:flex;background:none;border:0;padding:2px;color:var(--faint);cursor:pointer}
.srow{display:flex;align-items:center;gap:9px;height:46px;padding:0 11px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.mark{flex:0 0 auto;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:#fff}
.mark.done{background:var(--accent);border-color:var(--accent)}
.slabel{flex:0 0 auto;width:52px;font-size:11px;color:var(--muted)}
.svalue{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svalue small{color:var(--muted)}
.saction{flex:0 0 auto;background:none;border:0;padding:4px 0;font:inherit;font-size:11.5px;color:var(--accent);cursor:pointer}
</style>
</head>
