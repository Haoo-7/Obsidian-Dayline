<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>仪表条</title>
  <link rel="stylesheet" href="frame.css">
  <style>
    .bar {
      width: 440px;
      padding: 14px 16px 16px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(15, 20, 30, 0.24), 0 1px 0 rgba(15, 20, 30, 0.03);
    }

    .bar__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: #5f6673;
    }

    .meta i {
      width: 5px;
      height: 5px;
      border-radius: 2px;
      background: #7b3fe4;
    }

    .close {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: #5c636e;
    }

    .bar__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .key {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      color: #3f444b;
      background: linear-gradient(#fff, #f3f4f6);
      box-shadow: inset 0 0 0 1px #d3d6dd, 0 1px 0 #cfd2d9;
    }

    .value {
      min-width: 80px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .value .unit {
      margin-left: 2px;
      font-size: 12px;
      font-weight: 500;
      color: #5f6673;
    }

    .timefield {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      box-shadow: inset 0 0 0 1px #dfe1e6;
    }

    .timefield__label {
      font-size: 10.5px;
      color: #5f6673;
    }

    .timefield__value {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .btn {
      height: 34px;
      padding: 0 18px;
      border-radius: 9px;
      background: #7b3fe4;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app" aria-hidden="true">
    <aside class="app__side">
      <p class="app__title">Dayline</p>
      <p class="app__month">2026 年 10 月</p>
      <div class="app__grid">
        <i></i><i></i><i></i><i class="has"></i><i></i><i></i><i></i>
        <i class="has"></i><i></i><i class="has"></i><i></i><i></i><i class="has"></i><i></i>
        <i></i><i></i><i class="has"></i><i></i><i class="today"></i><i></i><i></i>
        <i></i><i></i><i></i><i class="has"></i><i></i><i></i><i></i>
        <i></i><i class="has"></i><i></i><i></i><i class="has"></i><i></i><i></i>
      </div>
    </aside>
    <main class="app__main"><i></i><i></i><i></i><i></i></main>
  </div>

  <div class="overlay">
    <section class="bar" role="dialog" aria-label="记录体感温度">
      <header class="bar__head">
        <span class="meta"><i></i><span data-sample="dateLong">2026年10月8日</span> · 手动记录</span>
        <button class="close" aria-label="关闭">✕</button>
      </header>

      <div class="bar__row">
        <div class="stepper">
          <button class="key" aria-label="降低一度">−</button>
          <div class="value"><span data-sample="temp">29</span><span class="unit">°C</span></div>
          <button class="key" aria-label="提高一度">+</button>
        </div>

        <div class="timefield">
          <span class="timefield__label">时间</span>
          <span class="timefield__value" data-sample="time">15:30</span>
        </div>

        <button class="btn">记录</button>
      </div>
    </section>
  </div>

  <script src="sample.js"></script>
</body>
</html>
