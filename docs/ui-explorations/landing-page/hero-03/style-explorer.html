.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

t-size: 14px; }\n  nav a { color: var(--muted); text-decoration: none; }\n\n  .hero { position: absolute; top: 112px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: flex-end; }\n  h1 { font-size: 60px; line-height: 1.14; font-weight: 650; letter-spacing: -.012em; }\n  h1 .file { font-family: var(--mono); font-weight: 500; font-size: .86em; letter-spacing: -.03em; }\n  .lede { margin-top: 18px; width: 560px; font-size: 17px; line-height: 1.7; color: var(--muted); }\n  .lede b { color: var(--ink); font-weight: 600; }\n  .act { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; padding-bottom: 6px; }\n  .btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 8px; background: var(--coral); color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; }\n  .btn svg { width: 16px; height: 16px; }\n  .sub { display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--muted); }\n  .sub a { color: var(--ink); font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }\n\n  /* 产品窗口 */\n  .win { position: absolute; top: 352px; left: 80px; width: 1280px; height: 640px; background: #fff; border: 1px solid #D9DAD5; border-radius: 14px; overflow: hidden;\n    box-shadow: 0 1px 2px rgba(13,19,24,.06), 0 40px 80px -40px rgba(13,19,24,.35); display: grid; grid-template-columns: 44px 336px 1fr 300px; grid-template-rows: 40px 1fr; font-size: 13px; color: var(--ob-text); }\n  .tb { grid-column: 1 / -1; display: grid; grid-template-columns: 380px 1fr 300px; border-bottom: 1px solid var(--ob-line); background: var(--ob-side); }\n  .tb > div { display: flex; align-items: center; padding: 0 14px; gap: 8px; }\n  .lights { gap: 8px !important; }\n  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #D5D5D5; }\n  .tab { align-self: end; height: 32px; padding: 0 14px; background: #fff; border: 1px solid var(--ob-line); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 40px; font-size: 12.5px; }\n  .tab span:last-child { color: var(--ob-faint); }\n  .tb .tl { border-left: 1px solid var(--ob-line); justify-content: flex-end; color: var(--ob-muted); }\n  .ico { width: 16px; height: 16px; color: var(--ob-muted); }\n\n  .ribbon { background: var(--ob-side); border-right: 1px solid var(--ob-line); display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 14px; }\n  .ribbon .on { color: var(--coral); }\n  /* 左侧栏：Dayline 月历 + 文件列表 */\n  .side { background: var(--ob-side); border-right: 1px solid var(--ob-line); padding: 14px 16px 0; overflow: hidden; }\n  .mnav { display: grid; grid-template-columns: 28px 1fr 28px 28px; gap: 6px; height: 30px; }\n  .mnav > * { display: grid; place-items: center; border-radius: 6px; background: #EBEBEB; }\n  .mnav b { font-size: 14px; font-weight: 600; }\n  .mnav svg { width: 14px; height: 14px; color: var(--ob-muted); }\n  .wcard { margin-top: 10px; border: 1px solid var(--ob-line); border-radius: 10px; background: #fff; }\n  .wnow { display: flex; gap: 12px; padding: 10px 12px; align-items: center; }\n  .wnow img { width: 34px; height: 34px; }\n  .wnow b { display: block; font-size: 15px; }\n  .wnow span { font-size: 11.5px; color: var(--ob-muted); line-height: 1.5; }\n  .otd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--ob-line); }\n  .otd i { width: 30px; height: 30px; border-radius: 5px; background: url(\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCARXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAABIAAAAAQAAAEgAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAAA4SgAwAEAAAAAQAAAlgAAAAA/8AAEQgCWAOEAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVp n        \u003cdt>\u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">\u003cpath d=\"M2 2h6l6 6-6 6-6-6z\"/>\u003ccircle cx=\"5.5\" cy=\"5.5\" r=\"1\"/>\u003c/svg>tags\u003c/dt>\u003cdd>\u003cspan class=\"pill\">海边\u003c/span>\u003cspan class=\"pill\">录音\u003c/span>\u003c/dd>\n      \u003c/dl>\n      \u003ch3>低潮线\u003c/h3>\n      \u003cp>小小的节奏还在。一张照片、一段很短的录音，让这一周安静的部分被看见。\u003c/p>\n      \u003cdiv class=\"img\">\u003c/div>\n    \u003c/main>\n\n    \u003caside class=\"tl-pane\">\n      \u003cdiv class=\"tl-head\">\u003cb>日记时间线\u003c/b>\u003cspan>21\u003c/span>\u003c/div>\n      \u003cdiv class=\"search\">搜索日记\u003c/div>\n      \u003cdiv class=\"trend\" id=\"trend\">\u003c/div>\n      \u003cdiv id=\"cards\">\u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\n\u003cscript>\n  const D = window.DAYLINE;\n  const pad = n => String(n).padStart(2, '0');\n  const byDay = Object.fromEntries(D.days.map(x => [x.d, x]));\n  const SEL = 18;\n\n  const cells = [];\n  for (let i = 0; i \u003c D.leadingBlanks; i++) cells.push('\u003cdiv class=\"c blank\">\u003c/div>');\n  for (let d = 1; d \u003c= D.daysInMonth; d++) {\n    const x = byDay[d];\n    cells.push(x\n      ? `\u003cdiv class=\"c photo${d === SEL ? ' sel' : ''}\" style=\"background-image:url(../assets/${x.cover}.jpg)\">\u003cspan class=\"n\">${d}\u003c/span>${D.wxSvg(x.wx, 'wx')}\u003cspan class=\"md\" style=\"background:${D.moods[x.mood]}\">\u003c/span>\u003c/div>`\n      : `\u003cdiv class=\"c empty\">\u003cspan class=\"n\">${d}\u003c/span>\u003c/div>`);\n  }\n  document.getElementById('grid').innerHTML = cells.join('');\n\n  const chev = '\u003csvg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\u003cpath d=\"M3 4.5 6 7.5 9 4.5\"/>\u003c/svg>';\n  document.getElementById('tree').innerHTML = `\u003cdiv>${chev}Calendar\u003c/div>\u003cdiv style=\"padding-left:18px\">${chev}Daily\u003c/div>` +\n    [16, 17, 18, 19, 20, 21].map(d => `\u003cdiv class=\"f${d === SEL ? ' on' : ''}\">2026-07-${pad(d)}\u003ci>.md\u003c/i>\u003c/div>`).join('');\n\n  // 近七天心情：值越高点越靠上，点用当天的心情色\n  const wk = D.days.slice(-7);\n  const pts = wk.map((x, i) => [8 + i * 30, 24 - (x.mood + 2) * 5]);\n  document.getElementById('trend').innerHTML = `\u003cspan>近 7 天\u003c/span>\u003csvg viewBox=\"0 0 196 30\">\n    \u003cpolyline points=\"${pts.map(p => p.join(',')).join(' ')}\" fill=\"none\" stroke=\"#C9C9C9\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\n    ${pts.map((p, i) => `\u003ccircle cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"4\" fill=\"${D.moods[wk[i].mood]}\" stroke=\"#F6F6F6\" stroke-width=\"1.5\"/>`).join('')}\u003c/svg>`;\n\n  const EX = {\n    21: '这份样本以一个干净的收尾结束：足够看懂这一周，也留出重新开始的空间。',\n    20: '长远的视野由一条条小记录拼成。今天的方向，稳到可以分享了。',\n    19: '没收尾的事不算失败，它是一个刻意留下、等更好的问题回来的地方。',\n    18: '小小的节奏还在。一张照片、一段很短的录音，让这一周安静的部分被看见。',\n  };\n  const WD = ['日', '一', '二', '三', '四', '五', '六'];\n  document.getElementById('cards').innerHTML = [21, 20, 19, 18].map(d => {\n    const x = byDay[d];\n    const wd = WD[new Date(2026, 6, d).getDay()];\n    return `\u003cdiv class=\"card${d === SEL ? ' on' : ''}\" style=\"--m:${D.moods[x.mood]}\">\u003cdiv>\u003cb>7月${d}日 周${wd}${d >= 20 ? '\u003cspan class=\"fav\">收藏\u003c/span>' : ''}\u003c/b>\u003cdiv class=\"t\">${x.title}\u003c/div>\u003cp>${EX[d]}\u003c/p>\u003c/div>\u003ci style=\"background-image:url(../assets/${x.cover}.jpg)\">\u003c/i>\u003c/div>`;\n  }).join('');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "a2.html", "baseline": true, "interactive": false, "nativeViewport": {"width": 1440, "height": 900}}, {"id": "split", "name": "L1 · 分栏特写", "concept": "左边把话说完，右边只放大最核心的月历，时间线错位在它身后", "typography": "PingFang SC 650 标题 58px，正文 17/1.75，功能行 14px", "palette": ["#F6F6F3", "#0D1318", "#5F656C", "#F1694D"], "traits": ["左右分栏", "月历放大到 50px 一格", "三行功能说明", "两层面板错位"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>L1 分栏特写\u003c/title>\n\u003cstyle>/* 三种排版共用：页面配色（来自 01）和 Dayline 界面碎片。版式各自写。 */\n:root {\n  --bg: #F6F6F3; --ink: #0D1318; --muted: #5F656C; --line: #DCDDD8; --coral: #F1694D;\n  --ob-side: #F6F6F6; --ob-line: #E3E3E3; --ob-text: #222; --ob-muted: #6B6B6B; --ob-faint: #7C7C7C;\n  --accent-soft: #FDE9E4; --accent-ink: #AD3A22;\n  --mono: \"SF Mono\", Menlo, ui-monospace, monospace;\n  --sans: \"PingFang SC\", -apple-system, \"Helvetica Neue\", sans-serif;\n  --cell: 40px; --cgap: 4px;\n}\n* { box-sizing: border-box; margin: 0; }\nbody { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }\n.page { position: relative; width: 1440px; height: 900px; margin: 0 auto; overflow: hidden; }\nsvg { display: block; }\n\n.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; color: var(--ink); text-decoration: none; }\n.brand svg { width: 34px; height: 22px; }\n.nav { display: flex; gap: 32px; font-size: 14px; }\n.nav a { color: var(--muted); text-decoration: none; }\n.btn { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 8px; background: var(--coral); color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap; }\n.btn svg { width: 16px; height: 16px; }\n.link { color: var(--ink); font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }\n.fine { font-size: 13px; color: var(--muted); }\n.mdx { font-family: var(--mono); font-weight: 500; font-size: .86em; letter-spacing: -.03em; }\n\n/* 月份栏 */\n.dl-mnav { display: grid; grid-template-columns: 28px 1fr 28px 28px; gap: 6px; height: 30px; color: var(--ob-text); }\n.dl-mnav > * { display: grid; place-items: center; border-radius: 6px; background: #EBEBEB; }\n.dl-mnav b { font-size: 14px; font-weight: 600; }\n.dl-mnav svg { width: 14px; height: 14px; color: var(--ob-muted); }\n\n/* 天气卡 + 去年今日 */\n.dl-wcard { border: 1px solid var(--ob-line); border-radius: 10px; background: #fff; color: var(--ob-text); }\n.dl-wnow { display: flex; gap: 12px; padding: 10px 12px; align-items: center; }\n.dl-wnow img { width: 34px; height: 34px; }\n.dl-wnow b { display: block; font-size: 15px; }\n.dl-wnow span { font-size: 12px; color: var(--ob-muted); line-height: 1.5; }\n.dl-otd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--ob-line); }\n.dl-otd i { flex: 0 0 30px; height: 30px; border-radius: 5px; background: center/cover; }\n.dl-otd b { display: block; font-size: 13px; }\n.dl-otd span { font-size: 12px; color: var(--ob-muted); }\n.dl-otd svg { margin-left: auto; width: 14px; height: 14px; color: var(--ob-faint); }\n\n/* 月历 */\n.dl-wk, .dl-grid { display: grid; grid-template-columns: repeat(7, var(--cell)); gap: var(--cgap); }\n.dl-wk { font-size: 11px; color: var(--ob-muted); text-align: center; }\n.dl-grid { grid-auto-rows: var(--cell); }\n.dl-c { position: relative; border-radius: 6px; overflow: hidden; }\n.dl-c.blank { visibility: hidden; }\n.dl-c.empty { background: #EFEFEF; }\n.dl-c .n { position: absolute; top: 3px; left: 5px; font-size: 11px; font-weight: 700; color: var(--ob-muted); }\n.dl-c.photo { background: #333 center/cover; }\n.dl-c.photo .n { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }\n.dl-c .wx { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; color: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }\n.dl-c .md { position: absolute; left: 4px; bottom: 4px; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); }\n.dl-c.sel { overflow: visible; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--coral); }\n.big .dl-c { border-radius: 8px; }\n.big .dl-c .n { top: 5px; left: 7px; font-size: 13px; }\n.big .dl-c .wx { top: 6px; right: 6px; width: 13px; height: 13px; }\n.big .dl-c .md { left: 6px; bottom: 6px; width: 11px; height: 11px; border-width: 2px; }\n.big .dl-wk { font-size: 12px; }\n\n/* 时间线 */\n.dl-search { height: 30px; border: 1px solid var(--ob-line); border-radius: 6px; background: #fff; display: flex; align-items: center; padding: 0 10px; color: var(--ob-faint); font-size: 12.5px; }\n.dl-trend { font-size: 12px; color: var(--ob-muted); }\n.dl-trend svg { width: 100%; height: 30px; margin-top: 4px; overflow: visible; }\n.dl-card { display: grid; grid-template-columns: 1fr 64px; gap: 10px; padding: 10px; background: #fff; border: 1px solid var(--ob-line); border-left: 3px solid var(--m); border-radius: 8px; color: var(--ob-text); }\n.dl-card.on { box-shadow: 0 0 0 1.5px var(--coral); }\n.dl-card b { display: block; font-size: 12.5px; }\n.dl-card .t { margin-top: 2px; font-size: 12.5px; font-weight: 600; }\n.dl-card p { margin-top: 3px; font-size: 12px; line-height: 1.5; color: var(--ob-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.dl-card .fav { color: var(--accent-ink); font-size: 11px; font-weight: 500; margin-left: 4px; }\n.dl-card i { width: 64px; height: 64px; border-radius: 6px; background: #333 center/cover; }\n\u003c/style>\n\u003cstyle>\n  header { position: absolute; top: 30px; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; }\n  .copy { position: absolute; left: 80px; top: 196px; width: 500px; }\n  h1 { font-size: 58px; line-height: 1.16; font-weight: 650; letter-spacing: -.012em; }\n  .lede { margin-top: 22px; font-size: 17px; line-height: 1.75; color: var(--muted); }\n  .lede b { color: var(--ink); font-weight: 600; }\n  .act { margin-top: 32px; display: flex; align-items: center; gap: 22px; }\n  .feats { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 12px; font-size: 14px; color: var(--muted); }\n  .feats li { list-style: none; display: grid; grid-template-columns: 96px 1fr; }\n  .feats b { color: var(--ink); font-weight: 600; }\n\n  /* 放大的月历面板，时间线在它身后 */\n  .tl { position: absolute; left: 1086px; top: 150px; width: 274px; height: 640px; padding: 16px 16px 0; background: var(--ob-side); border: 1px solid #D9DAD5; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px -40px rgba(13,19,24,.35); }\n  .tl-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; color: var(--ob-text); }\n  .tl-head b { font-size: 17px; }\n  .tl-head span { color: var(--ob-muted); font-size: 12px; }\n  .tl .dl-trend { margin: 10px 0 2px; }\n  .tl .dl-card { margin-top: 10px; }\n  .panel { position: absolute; left: 640px; top: 196px; width: 426px; padding: 20px; background: var(--ob-side); border: 1px solid #D9DAD5; border-radius: 16px;\n    box-shadow: 0 1px 2px rgba(13,19,24,.06), 0 40px 70px -36px rgba(13,19,24,.45); --cell: 50px; --cgap: 6px; }\n  .panel .dl-wcard { margin-top: 12px; }\n  .panel .dl-wk { margin-top: 16px; }\n  .panel .dl-grid { margin-top: 8px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cheader>\n    \u003ca class=\"brand\" href=\"#\" id=\"brand\">Dayline\u003c/a>\n    \u003cnav class=\"nav\">\u003ca href=\"#features\">功能\u003c/a>\u003ca href=\"#install\">安装\u003c/a>\u003ca href=\"#github\">GitHub\u003c/a>\u003c/nav>\n  \u003c/header>\n\n  \u003csection class=\"copy\">\n    \u003ch1>你写过的每一天，\u003cbr>不该只是一串\u003cspan class=\"mdx\">.md\u003c/span>\u003c/h1>\n    \u003cp class=\"lede\">\u003cb>Dayline\u003c/b> 是一个 Obsidian 插件。它把每日笔记文件夹变成一面照片月历，标出心情和天气。笔记原样留在你的 vault 里。\u003c/p>\n    \u003cdiv class=\"act\" id=\"install\">\u003ca class=\"btn\" href=\"#install\" id=\"dl\">在 Obsidian 中安装\u003c/a>\u003ca class=\"link\" href=\"#github\">GitHub\u003c/a>\u003cspan class=\"fine\">免费 · MIT 开源\u003c/span>\u003c/div>\n    \u003cul class=\"feats\">\n      \u003cli>\u003cb>照片月历\u003c/b>笔记里的图片自动成为日期封面\u003c/li>\n      \u003cli>\u003cb>日记时间线\u003c/b>全文搜索，按心情、标签、位置筛选\u003c/li>\n      \u003cli>\u003cb>心情与天气\u003c/b>五级心情、天气快照和去年今日\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003caside class=\"tl\" aria-hidden=\"true\">\n    \u003cdiv class=\"tl-head\">\u003cb>日记时间线\u003c/b>\u003cspan>21\u003c/span>\u003c/div>\n    \u003cdiv class=\"dl-search\">搜索日记\u003c/div>\n    \u003cdiv id=\"trend\">\u003c/div>\n    \u003cdiv id=\"cards\">\u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"panel big\" id=\"panel\" aria-label=\"Dayline 月历\">\u003c/div>\n\u003c/div>\n\n\n\u003cscript>\n  document.getElementById('brand').insertAdjacentHTML('afterbegin', UI.logo());\n  document.getElementById('dl').insertAdjacentHTML('afterbegin', UI.download);\n  document.getElementById('panel').innerHTML = UI.mnav() + UI.weather() + UI.weekdays() + UI.grid(18);\n  document.getElementById('trend').innerHTML = UI.trend(242);\n  document.getElementById('cards').innerHTML = UI.cards([21, 20, 19, 18, 17]);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "l1.html", "baseline": false, "interactive": false, "nativeViewport": {"width": 1440, "height": 900}}, {"id": "window", "name": "L2 · 画面即界面", "concept": "首屏本身就是 Obsidian：官网写在打开的 Dayline.md 里，两侧是真实的月历和时间线", "typography": "PingFang SC 650 标题 54px，属性 13px，正文 17/1.75", "palette": ["#F6F6F3", "#FFFFFF", "#0D1318", "#F1694D"], "traits": ["画面即界面", "价格、许可、平台写成笔记属性", "三步开始写成笔记正文", "导航长在标签栏上"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewp t: 6px; bottom: 6px; width: 11px; height: 11px; border-width: 2px; }\n.big .dl-wk { font-size: 12px; }\n\n/* 时间线 */\n.dl-search { height: 30px; border: 1px solid var(--ob-line); border-radius: 6px; background: #fff; display: flex; align-items: center; padding: 0 10px; color: var(--ob-faint); font-size: 12.5px; }\n.dl-trend { font-size: 12px; color: var(--ob-muted); }\n.dl-trend svg { width: 100%; height: 30px; margin-top: 4px; overflow: visible; }\n.dl-card { display: grid; grid-template-columns: 1fr 64px; gap: 10px; padding: 10px; background: #fff; border: 1px solid var(--ob-line); border-left: 3px solid var(--m); border-radius: 8px; color: var(--ob-text); }\n.dl-card.on { box-shadow: 0 0 0 1.5px var(--coral); }\n.dl-card b { display: block; font-size: 12.5px; }\n.dl-card .t { margin-top: 2px; font-size: 12.5px; font-weight: 600; }\n.dl-card p { margin-top: 3px; font-size: 12px; line-height: 1.5; color: var(--ob-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n.dl-card .fav { color: var(--accent-ink); font-size: 11px; font-weight: 500; margin-left: 4px; }\n.dl-card i { width: 64px; height: 64px; border-radius: 6px; background: #333 center/cover; }\n\u003c/style>\n\u003cstyle>\n  /* 整个首屏就是一扇 Obsidian 窗口，落地页写在打开的那篇笔记里 */\n  .win { position: absolute; inset: 20px 20px 0; background: #fff; border: 1px solid #D9DAD5; border-bottom: 0; border-radius: 14px 14px 0 0; overflow: hidden;\n    display: grid; grid-template-columns: 44px 316px 1fr 300px; grid-template-rows: 44px 1fr; box-shadow: 0 30px 70px -40px rgba(13,19,24,.3); color: var(--ob-text); font-size: 13px; }\n  .tb { grid-column: 1 / -1; display: grid; grid-template-columns: 360px 1fr 300px; background: var(--ob-side); border-bottom: 1px solid var(--ob-line); }\n  .tb > div { display: flex; align-items: center; padding: 0 16px; gap: 10px; }\n  .lights { gap: 8px !important; }\n  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #D5D5D5; }\n  .tb .brand { margin-left: 18px; font-size: 15px; }\n  .tb .brand svg { width: 28px; height: 18px; }\n  .tab { align-self: end; height: 34px; padding: 0 16px; background: #fff; border: 1px solid var(--ob-line); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 36px; font-size: 12.5px; }\n  .tab span:last-child { color: var(--ob-faint); }\n  .tb .nav { margin-left: auto; gap: 26px; font-size: 13.5px; }\n  .tb .right { border-left: 1px solid var(--ob-line); justify-content: flex-end; }\n\n  .ribbon { background: var(--ob-side); border-right: 1px solid var(--ob-line); display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 14px; color: var(--ob-muted); }\n  .ribbon svg { width: 16px; height: 16px; }\n  .ribbon .on { color: var(--coral); }\n\n  .side { background: var(--ob-side); border-right: 1px solid var(--ob-line); padding: 14px 14px 0; --cell: 38px; --cgap: 3px; overflow: hidden; }\n  .side .dl-wcard { margin-top: 10px; }\n  .side .dl-wk { margin-top: 12px; }\n  .side .dl-grid { margin-top: 6px; }\n  .tree { margin: 16px -14px 0; padding: 10px 14px; border-top: 1px solid var(--ob-line); font-size: 13px; }\n  .tree div { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-radius: 5px; }\n  .tree svg { width: 11px; height: 11px; color: var(--ob-faint); }\n  .tree .f { padding-left: 24px; }\n  .tree .on { background: var(--accent-soft); color: var(--accent-ink); }\n\n  .note { padding: 0 72px; overflow: hidden; }\n  .crumb { height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--ob-muted); }\n  .crumb i { font-style: normal; color: var(--ob-faint); }\n  .props { margin-top: 26px; display: grid; grid-template-columns: 110px 1fr; row-gap: 9px; font-size: 13px; }\n  .props dt { color: var(--ob-muted); }\n  .pill { display: inline-block; padding: 1px 9px; margin-right: 6px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; }\n  .note h1 { margin-top: 40px; font-size: 54px; line-height: 1.16; font-weight: 650; letter-spacing: -.012em; color: var(--ink); }\n  .note .lede { margin-top: 20px; max-width: 560px; font-size: 17px; line-height: 1.75; color: var(--muted); }\n  .note .lede b { color: var(--ink); font-weight: 600; }\n  .act { margin-top: 30px; display: flex; align-items: center; gap: 22px; }\n  .note h3 { margin-top: 52px; font-size: 18px; font-weight: 700; color: var(--ob-text); }\n  .note ol { margin-top: 12px; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; line-height: 1.6; color: #333; }\n  .note code { font-family: var(--mono); font-size: 12.5px; padding: 1px 6px; border-radius: 4px; background: #F1F1F1; }\n\n  .tl { background: var(--ob-side); border-left: 1px solid var(--ob-line); padding: 14px 14px 0; overflow: hidden; }\n  .tl-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }\n  .tl-head b { font-size: 17px; }\n  .tl-head span { color: var(--ob-muted); font-size: 12px; }\n  .tl .dl-trend { margin: 10px 0 2px; }\n  .tl .dl-card { margin-top: 10px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cdiv class=\"win\">\n    \u003cdiv class=\"tb\">\n      \u003cdiv class=\"lights\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ca class=\"brand\" href=\"#\" id=\"brand\">Dayline\u003c/a>\u003c/div>\n      \u003cdiv>\u003cspan class=\"tab\">\u003cspan>Dayline.md\u003c/span>\u003cspan>×\u003c/span>\u003c/span>\u003cnav class=\"nav\">\u003ca href=\"#features\">功能\u003c/a>\u003ca href=\"#install\">安装\u003c/a>\u003ca href=\"#github\">GitHub\u003c/a>\u003c/nav>\u003c/div>\n      \u003cdiv class=\"right\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#6B6B6B\" stroke-width=\"1.4\">\u003crect x=\"2\" y=\"2.5\" width=\"12\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M10 2.5v11\"/>\u003c/svg>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"ribbon\" aria-hidden=\"true\">\n      \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">\u003cpath d=\"M4 2h6l3 3v9H4z\"/>\u003c/svg>\n      \u003csvg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\">\u003ccircle cx=\"4\" cy=\"4\" r=\"2\"/>\u003ccircle cx=\"12\" cy=\"4\" r=\"2\"/>\u003ccircle cx=\"8\" cy=\"12\" r=\"2\"/>\u003cpath d=\"M5.5 5.5 7 10.5M10.5 5.5 9 10.5\"/>\u003c/svg>\n      \u003csvg class=\"on\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\u003crect x=\"2\" y=\"3\" width=\"12\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M2 6.5h12M5.5 1.5v3M10.5 1.5v3\"/>\u003c/svg>\n    \u003c/div>\n\n    \u003caside class=\"side\" id=\"side\" aria-hidden=\"true\">\u003c/aside>\n\n    \u003cmain class=\"note\">\n      \u003cdiv class=\"crumb\">Plugins \u003ci>/\u003c/i> Dayline\u003c/div>\n      \u003cdl class=\"props\">\n        \u003cdt>price\u003c/dt>\u003cdd>免费\u003c/dd>\n        \u003cdt>license\u003c/dt>\u003cdd>MIT 开源\u003c/dd>\n        \u003cdt>platforms\u003c/dt>\u003cdd>桌面端 · 手机端\u003c/dd>\n        \u003cdt>requires\u003c/dt>\u003cdd>Obsidian 1.5.0+\u003c/dd>\n        \u003cdt>tags\u003c/dt>\u003cdd>\u003cspan class=\"pill\">日历\u003c/span>\u003cspan class=\"pill\">日记\u003c/span>\u003cspan class=\"pill\">心情\u003c/span>\u003cspan class=\"pill\">天气\u003c/span>\u003c/dd>\n      \u003c/dl>\n      \u003ch1>你写过的每一天，\u003cbr>不该只是一串\u003cspan class=\"mdx\">.md\u003c/span>\u003c/h1>\n      \u003cp class=\"lede\">\u003cb>Dayline\u003c/b> 把每日笔记文件夹变成你左边看到的照片月历和右边的日记时间线，标出心情和天气。笔记原样留在你的 vault 里。\u003c/p>\n      \u003cdiv class=\"act\" id=\"install\">\u003ca class=\"btn\" href=\"#install\" id=\"dl\">在 Obsidian 中安装\u003c/a>\u003ca class=\"link\" href=\"#github\">在 GitHub 查看源码\u003c/a>\u003c/div>\n      \u003ch3>三步开始\u003c/h3>\n      \u003col>\u003cli>安装并启用 Dayline，运行命令 \u003ccode>Open Dayline\u003c/code>。\u003c/li>\u003cli>在设置里选好每日笔记文件夹，默认是 \u003ccode>Calendar/Daily\u003c/code>。\u003c/li>\u003cli>点日期打开那天的笔记，或者在时间线里搜过去。\u003c/li>\u003c/ol>\n    \u003c/main>\n\n    \u003caside class=\"tl\" aria-hidden=\"true\">\n      \u003cdiv class=\"tl-head\">\u003cb>日记时间线\u003c/b>\u003cspan>21\u003c/span>\u003c/div>\n      \u003cdiv class=\"dl-search\">搜索日记\u003c/div>\n      \u003cdiv id=\"trend\">\u003c/div>\n      \u003cdiv id=\"cards\">\u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\n\u003cscript>\n  document.getElementById('brand').insertAdjacentHTML('afterbegin', UI.logo());\n  document.getElementById('dl').insertAdjacentHTML('afterbegin', UI.download);\n  const chev = '\u003csvg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\u003cpath d=\"M3 4.5 6 7.5 9 4.5\"/>\u003c/svg>';\n  document.getElementById('side').innerHTML = UI.mnav() + UI.weather() + UI.weekdays() + UI.grid(0) +\n    `\u003cdiv class=\"tree\">\u003cdiv>${chev}Calendar\u003c/div>\u003cdiv>${chev}Plugins\u003c/div>\u003cdiv class=\"f on\">Dayline.md\u003c/div>\u003c/div>`;\n  document.getElementById('trend').innerHTML = UI.trend(272);\n  document.getElementById('cards').innerHTML = UI.cards([21, 20, 19, 18, 17], 0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "l2.html", "baseline": false, "interactive": false, "nativeViewport": {"width": 1440, "height": 900}}, {"id": "bento", "name": "L3 · 功能拼贴", "concept": "首屏一次摆出四个功能的真实界面，每块底下一句话说它是什么", "typography": "PingFang SC 650 标题 54px，正文 17/1.75，说明 14px", "palette": ["#F6F6F3", "#F6F6F6", "#0D1318", "#F1694D"], "traits": ["网格拼贴", "月历、时间线、心情、天气四块", "标题直接放在画布上", "首屏就把功能讲完"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'\">\n\u003cmeta charset=\"utf-8\">\  function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  if(c.typography)row(t('fonts'),c.typography);if(c.traits?.length)row(t('traits'),c.traits.join(' · '));return dl.children.length?dl:null;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name));const mini=stripMini(c);if(mini)cap.append(mini);cap.append(pickButton(c));
  a.append(frame,cap);if(c.concept){const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;a.append(lede);}return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=byId[f.parentElement.dataset.id].nativeViewport?'native':st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  if(c.concept)blocks.push(el('p','north',c.concept));if(sw.children.length)blocks.push(sw);const spec=specList(c);if(spec)blocks.push(spec);
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 // 每个候选都声明了固定画布时，桌面和手机的切换不起作用，收起来。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
