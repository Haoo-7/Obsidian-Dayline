    <text x="142" y="94" fill="#737984" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">OBSIDIAN JOURNAL PLUGIN</text>
  </g>

  <g id="title-block">
    <text x="64" y="153" fill="#17191E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760">A visual journal</text>
    <text x="64" y="207" fill="#17191E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760">inside Obsidian.</text>
    <text x="64" y="246" fill="#606671" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Calendar, timeline, mood, weather, and memories,</text>
    <text x="64" y="273" fill="#606671" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">built on the Markdown notes you already keep.</text>
  </g>

